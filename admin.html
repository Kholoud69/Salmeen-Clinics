<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            margin: 10px auto;
            padding: 15px;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
    </style>
</head>

<body>

    <h1>📋 Bookings Dashboard</h1>

    <div id="list"></div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "salmeen-clinics.firebaseapp.com",
            projectId: "salmeen-clinics",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const list = document.getElementById("list");

        // 🔥 LIVE DATA (REAL TIME)
        onSnapshot(collection(db, "bookings"), (snapshot) => {

            list.innerHTML = "";

            snapshot.forEach(doc => {
                const b = doc.data();

                list.innerHTML += `
            <div class="card">
                <h3>👤 ${b.name}</h3>
                <p>👨‍⚕️ Doctor: ${b.doctor}</p>
                <p>📞 Phone: ${b.phone}</p>
                <p>📅 Date: ${b.date}</p>
                <p>⏰ Time: ${b.time}</p>
                <p>⏰ Consultion Type: ${b.cons}</p>

            </div>
        `;
            });

        });

    </script>

</body>

</html>
